name: Production concurrency probe (temporary)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/production-concurrency-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fire a refresh's four worker requests at once, three rounds
        run: |
          node --input-type=module <<'JS'
          const base='https://analyzer42-sec.raffialwasof-1999.workers.dev/?ticker=';
          const lines=[];
          for(const t of ['BAC','AAPL']) for(let round=1;round<=2;round++){
            const rev=Date.now()+'-'+round;
            const urls=[t, t+'&basicEpsCsv=quarterly&revision='+rev, t+'&basicEpsCsv=annual&revision='+rev, t+'&blankReasons=1&revision='+rev];
            const res=await Promise.all(urls.map(async u=>{const s=Date.now();try{const r=await fetch(base+u);const b=await r.text();const code=(b.match(/Error\s*(?:code)?\s*:?\s*(1\d{3})/i)||[])[1]; const title=(b.match(/<title>([^<]*)/i)||[])[1]||''; const ray=r.headers.get('cf-ray')||''; return `${r.status} ${Date.now()-s}ms ${u.split('&')[1]?.split('=')[0]||'main'} :: ${r.status===200?'ok':'CF '+(code||'?')+' | '+title.trim().slice(0,90)} ${ray}`;}catch(e){return 'FETCH-ERR '+e.message;}}));
            lines.push(`${t} round ${round}`, ...res.map(x=>'  '+x));
            await new Promise(r=>setTimeout(r,3000));
          }
          console.log(lines.join('\n'));
          console.log('::notice title=Concurrency probe::'+lines.join('%0A').replace(/::/g,';'));
          JS
