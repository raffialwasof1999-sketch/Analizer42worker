name: Live SEC coverage audit across tickers
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tickers:
        description: Comma-separated tickers (blank for the default mix)
        required: false
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run this branch's worker against live SEC data
        env:
          TICKERS: ${{ github.event.inputs.tickers }}
        run: node .github/scripts/eps-coverage-audit.mjs
