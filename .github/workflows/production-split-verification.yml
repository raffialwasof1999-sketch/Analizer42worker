name: Verify production SEC split deployment
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  production-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check production Cloudflare Worker against live SEC data
        env:
          PROD: https://analyzer42-sec.raffialwasof-1999.workers.dev
        run: |
          set -euo pipefail
          for ticker in AAPL NVDA TSLA GE MSFT; do
            echo "Checking production $ticker"
            curl --fail-with-body --silent --show-error --max-time 90 \
              "$PROD/?ticker=$ticker" -o "/tmp/$ticker.json"
            TICKER="$ticker" node <<'JS'
          const fs = require('fs');
          const ticker=process.env.TICKER;
          const d=JSON.parse(fs.readFileSync('/tmp/'+ticker+'.json','utf8'));
          if (!d.success) throw Error(ticker+': '+d.error);
          if (!d.stockSplitAudit?.companyFactsNormalization) throw Error(ticker+': production is missing new split normalization');
          const meta=d.stockSplitAudit.companyFactsNormalization;
          if (!Array.isArray(d.annualFinancials)||!Array.isArray(d.quarterlyFinancials))
            throw Error(ticker+': financial output missing');
          if (ticker==='AAPL' && !meta.annualApplied)
            throw Error('Apple split normalization not applied');
          if (ticker==='MSFT' && meta.annualApplied)
            throw Error('Unexpected historical Microsoft split normalization');
          if (!d.annualFinancials[0].hasOwnProperty('fiscalYear') ||
              !d.annualFinancials[0].hasOwnProperty('dilutedEPS'))
            throw Error('Annual spreadsheet schema changed');
          console.log(JSON.stringify({ticker,annualApplied:meta.annualApplied,
            quarterlyApplied:meta.quarterlyApplied,
            annualUnverified:meta.annualUnverified,
            changedBasisEdges:meta.changedBasisEdges,
            latestYear:d.annualFinancials[0].fiscalYear,
            latestEPS:d.annualFinancials[0].dilutedEPS}));
          JS
          done

      - name: Verify production basic EPS after main deployment
        if: github.event_name == 'push'
        env:
          PROD: https://analyzer42-sec.raffialwasof-1999.workers.dev
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            echo "Checking production basic EPS attempt $attempt"
            if curl --fail --silent --show-error --max-time 90 \
              "$PROD/?ticker=AAPL" -o /tmp/aapl-basic-production.json &&
              node <<'JS'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/aapl-basic-production.json','utf8'));
          if(!d.success)throw Error(d.error);
          const a=d.annualFinancials.find(r=>r.fiscalYear===2025);
          const q=d.quarterlyFinancials.find(r=>r.fiscalYear===2025&&r.fiscalQuarter===4);
          if(Math.abs(a?.basicEPS-7.49)>.03)throw Error('Annual basic EPS not deployed: '+a?.basicEPS);
          if(Math.abs(q?.basicEPS-1.85)>.06)throw Error('Q4 basic EPS not deployed: '+q?.basicEPS);
          if(!d.stockSplitAudit?.basicEPSHistoricalNormalization)
            throw Error('Split-basis safeguards not deployed');
          console.log('Production SEC basic EPS verified:',JSON.stringify({annual:a.basicEPS,q4:q.basicEPS}));
          JS
            then
              exit 0
            fi
            sleep 20
          done
          echo 'Production did not converge to the tested basic EPS release'
          exit 1

      - name: Verify spreadsheet CSV source and stable SEC quarter order
        if: github.event_name == 'push'
        env:
          PROD: https://analyzer42-sec.raffialwasof-1999.workers.dev
        run: |
          set -euo pipefail
          for period in annual quarterly; do
            curl --fail-with-body --silent --show-error --max-time 90 \
              "$PROD/?ticker=AAPL&basicEpsCsv=$period" -o "/tmp/basic-$period.csv"
            PERIOD="$period" node <<'JS'
          const fs=require('fs');
          const p=process.env.PERIOD;
          const rows=fs.readFileSync('/tmp/basic-'+p+'.csv','utf8').trimEnd().split(/\r?\n/);
          if(!rows.every(x=>x==='NA'||/^-?\d+(?:\.\d+)?$/.test(x)))
            throw Error('Invalid basic EPS CSV rows');
          if(p==='annual'&&Math.abs(Number(rows[0])-7.49)>.03)
            throw Error('Missing Apple annual basic EPS in CSV');
          if(p==='quarterly'&&Math.abs(Number(rows[3])-1.85)>.06)
            throw Error('Missing Apple Q4 basic EPS in CSV');
          console.log('CSV feed verified:',p,rows.length,'rows; first EPS:',rows[0]);
          JS
          done

      - name: Verify production AVGO five-year basic EPS after deployment
        if: github.event_name == 'push'
        env:
          PROD: https://analyzer42-sec.raffialwasof-1999.workers.dev
        run: |
          set -euo pipefail
          for attempt in $(seq 1 16); do
            echo "AVGO SEC production verification attempt $attempt"
            if curl --fail-with-body --silent --show-error --max-time 90 \
              "$PROD/?ticker=AVGO" -o /tmp/avgo-basic-production.json && 
              node <<'JS'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/avgo-basic-production.json','utf8'));
          if(!d.success)throw Error('AVGO '+d.error);
          const rows=d.quarterlyFinancials;
          const quarter=(fy,q)=>rows.find(x=>x.fiscalYear===fy&&x.fiscalQuarter===q)?.basicEPS;
          for(const [fy,q,eps,tolerance] of [
            [2020,4,.308,.018],[2021,4,.465,.020],[2023,4,.850,.025],
            [2025,4,1.81,.06],[2026,3,2.75,.035]
          ]){
            const actual=quarter(fy,q);
            if(typeof actual!=='number'||Math.abs(actual-eps)>tolerance)
              throw Error('AVGO '+fy+'Q'+q+' expected '+eps+' got '+actual);
          }
          const prior=rows.filter(x=>x.fiscalYear>=2021&&x.fiscalYear<=2023);
          if(prior.length!==12||prior.some(x=>typeof x.basicEPS!=='number'))
            throw Error('AVGO historical fiscal 2021-2023 missing basic EPS');
          const status=d.stockSplitAudit?.basicEPSHistoricalNormalization;
          if(!status||status.unavailableCount>0)
            throw Error('AVGO split basis missing '+JSON.stringify(status));
          console.log('AVGO production basic EPS verified: ',JSON.stringify({
            2020:quarter(2020,4),2021:quarter(2021,4),2023:quarter(2023,4),
            historicalQuarters:prior.length,missing:status.unavailableCount
          }));
          JS
            then
              exit 0
            fi
            sleep 20
          done
          echo 'AVGO production Worker has not deployed or cannot prove historical basic EPS'
          exit 1
