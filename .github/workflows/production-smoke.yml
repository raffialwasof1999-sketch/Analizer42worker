name: Analyzer42 production health
on:
  pull_request:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed Cloudflare Worker serves split-normalized SEC facts
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 35 \
              "https://analyzer42-sec.raffialwasof-1999.workers.dev/?ticker=AAPL" \
              -o /tmp/analyzer42-prod.json; then
              if node -e "const d=require('/tmp/analyzer42-prod.json');const y=d.annualFinancials?.find(x=>x.fiscalYear===2019);if(d.success===true&&d.stockSplitAudit?.companyFactsNormalization?.annualApplied===true&&Math.abs((y?.dilutedEPS||0)-2.97)<0.001){console.log(JSON.stringify({production:true,ticker:d.ticker,eps2019:y.dilutedEPS,splitAudit:d.stockSplitAudit.companyFactsNormalization}));process.exit(0)};process.exit(1)"; then
                exit 0
              fi
            fi
            sleep 12
          done
          echo 'Production Worker does not yet return the verified split-aware response'
          exit 1
