name: Compare worker values with main
on:
  pull_request:
    branches: [main]
    paths: ['src/**', '.github/scripts/compare-with-main.mjs', '.github/workflows/compare-with-main.yml']
  workflow_dispatch:
    inputs:
      tickers:
        description: Comma-separated tickers (blank for the default mix)
        required: false
      base:
        description: Commit or branch to compare against (default main)
        required: false
permissions:
  contents: read
  pull-requests: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.base || 'main' }}
          path: base
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run main's and this branch's worker on the same SEC data
        env:
          TICKERS: ${{ github.event.inputs.tickers }}
          BASE_REF: ${{ github.event.inputs.base || 'main' }}
        run: node .github/scripts/compare-with-main.mjs
      - name: Post the report on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # A manual run posts on the open pull request of its branch, if any.
        run: gh pr comment "${PR:-$GITHUB_REF_NAME}" --repo ${{ github.repository }} --body-file compare-report.md || true
