name: SEC split audit tests
on:
  push:
    branches: [feature/sec-split-audit]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  live-preview:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check Cloudflare preview with live SEC data
        env:
          PREVIEW_URL: https://feature-sec-split-audit-analyzer42-sec.raffialwasof-1999.workers.dev
        run: |
          sleep 45
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 125 \
              "$PREVIEW_URL/?ticker=AAPL&discoverSplits=1&maxDocuments=8" \
              -o /tmp/response.json; then
              node -e "const f=require('/tmp/response.json');if(!f.success || !f.splitDiscovery) {console.error(f);process.exit(1)};console.log(JSON.stringify({ticker:f.ticker,documentsRead:f.splitDiscovery.documentsRead,archiveCount:f.splitDiscovery.archiveCount,failedArchives:f.splitDiscovery.failedArchives,verifiedEvents:f.splitDiscovery.verifiedEvents,previewCount:f.splitDiscovery.normalizedPreview.length,failedDocuments:f.splitDiscovery.failedDocuments}));"
              curl --fail --silent --show-error --max-time 90 \
                "$PREVIEW_URL/?ticker=AAPL&basisAudit=1" -o /tmp/basis.json
              node -e "const d=require('/tmp/basis.json');if(!d.success || !d.shareBasisGraph || d.shareBasisGraph.filingCount<2) {console.error(d.error||d);process.exit(3)}; console.log(JSON.stringify({ticker:d.ticker,filings:d.shareBasisGraph.filingCount,connected:d.shareBasisGraph.connectedFilings,changedEdges:d.shareBasisGraph.changedBasisEdges.length,conflicts:d.shareBasisGraph.conflicts.length,adjustedAnnual:d.adjustedAnnualFinancials.adjustments.length,issues:d.adjustedAnnualFinancials.issues.length}))"
              for TICKER in NVDA TSLA GE MSFT; do
                curl --fail --silent --show-error --max-time 90 \
                  "$PREVIEW_URL/?ticker=$TICKER&basisAudit=1" -o /tmp/company.json
                node -e "const d=require('/tmp/company.json');if(!d.success||!d.shareBasisGraph){console.error(d.error||d);process.exit(4)}; console.log(JSON.stringify({ticker:d.ticker,filings:d.shareBasisGraph.filingCount,connected:d.shareBasisGraph.connectedFilings,changedEdges:d.shareBasisGraph.changedBasisEdges.length,conflicts:d.shareBasisGraph.conflicts.length,adjustedAnnual:d.adjustedAnnualFinancials.adjustments.length,issues:d.adjustedAnnualFinancials.issues.length}))"
              done
              node -e "if(require('/tmp/response.json').splitDiscovery.documentsRead<1)process.exit(2)"
              exit 0
            fi
            sleep 15
          done
          exit 1
