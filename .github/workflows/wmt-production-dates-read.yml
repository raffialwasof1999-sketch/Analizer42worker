name: Read-only Walmart production disclosure dates
on:
  push:
    branches:
      - audit/wmt-production-dates-20261020
jobs:
  dates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read current Worker historical WMT quarterly dates
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 \
            "https://analyzer42-sec.raffialwasof-1999.workers.dev/?ticker=WMT" \
            -o /tmp/wmt-live.json
          node <<'JS'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync('/tmp/wmt-live.json','utf8'));
          if(!d.success||d.ticker!=='WMT'||d.schemaVersion!=='AA_SEC_V3')
            throw Error('Production Worker is not returning verified WMT data');
          const rows=d.quarterlyFinancials;
          if(rows.length!==60)throw Error('Unexpected WMT quarter history length: '+rows.length);
          if(rows.find(x=>x.fiscalPeriodEnd==='2023-04-30')?.earningsDisclosureDate!=='2023-05-18')
            throw Error('Historical SEC recovery is not live');
          console.log('WMT_DATES_START');
          console.log(JSON.stringify(rows.map(r=>({
            end:r.fiscalPeriodEnd,
            report:r.secFilingDate,
            earnings:r.earningsDisclosureDate
          }))));
          console.log('WMT_DATES_END');
          JS
      - name: Audit live basic EPS CSV feeds used by Google Sheets
        run: |
          set -e
          base="https://analyzer42-sec.raffialwasof-1999.workers.dev/"
          for type in quarterly annual; do
            file="/tmp/wmt-${type}.csv"
            curl --retry 2 --retry-delay 2 --max-time 100 --fail-with-body --show-error --silent \
              "${base}?ticker=WMT&basicEpsCsv=${type}&revision=3" -o "$file"
            echo "FEED_${type}_START"
            node -e '
              const fs=require("fs");
              const f=fs.readFileSync(process.argv[1],"utf8");
              const lines=f.trim().split(/\r?\n/);
              const nums=lines.filter(s=>Number.isFinite(Number(s)));
              console.log(JSON.stringify({length:lines.length,nonempty:lines.filter(x=>x!=="NA").length,numeric:nums.length,first:lines.slice(0,6),last:lines.slice(-4)}));
              if(lines.length<(process.argv[2]==="quarterly"?50:15) || nums.length<10)process.exitCode=1;
            ' "$file" "$type"
            echo "FEED_${type}_END"
          done

      - name: Check live Netflix split-crossing Q3 and Q4 EPS
        run: |
          curl --retry 2 --max-time 120 --fail-with-body -sS "https://analyzer42-sec.raffialwasof-1999.workers.dev/?ticker=NFLX" -o /tmp/nflx-check.json
          node <<'JS'
          const d=require('/tmp/nflx-check.json');
          const q3=d.quarterlyFinancials.find(q=>q.fiscalPeriodEnd==='2025-09-30');
          const q4=d.quarterlyFinancials.find(q=>q.fiscalPeriodEnd==='2025-12-31');
          console.log('NFLX_SPLIT_PRODUCTION:'+JSON.stringify({q3:q3?.basicEPS,q4:q4?.basicEPS,sourceQ4:d.stockSplitAudit?.splitCrossingQ4BasicEPS||[],retrievedAt:d.retrievedAt}));
          if(!d.success || d.ticker!=='NFLX'||Math.abs(q3?.basicEPS-.60)>.015 || !(q4?.basicEPS>0))
            throw Error('NFLX split-crossing basic EPS has not been recovered in production');
          JS

      - name: Read latest Netflix ROIC columns for safe sheet synchronization
        run: |
          curl --retry 2 --max-time 120 --fail-with-body -sS \
            "https://analyzer42-sec.raffialwasof-1999.workers.dev/?ticker=NFLX&roicSnapshot=20261020" \
            -o /tmp/nflx-roic-snapshot.json
          node <<'JS'
          const d=require('/tmp/nflx-roic-snapshot.json');
          if(!d.success||d.ticker!=='NFLX'||d.schemaVersion!=='AA_SEC_V3')
            throw Error('Unexpected Worker payload, not safe for sheet sync');
          const snapshot={
            annual:d.annualFinancials.map(r=>({
              year:r.fiscalYear,short:r.shortTermDebt,long:r.longTermDebt,debt:r.totalDebt,
              invested:r.investedCapital,average:r.averageInvestedCapital,roic:r.roic
            })),
            quarters:d.quarterlyFinancials.map(r=>({
              end:r.fiscalPeriodEnd,debt:r.totalDebt,invested:r.investedCapital
            }))
          };
          console.log('NFLX_ROIC_SNAPSHOT:'+JSON.stringify(snapshot));
          JS

      - name: Read-only Netflix historical ROIC sync snapshot
        run: |
          curl --retry 2 --max-time 120 --fail-with-body -sS \
            "https://analyzer42-sec.raffialwasof-1999.workers.dev/?ticker=NFLX&roicSync=20261020-v2" \
            -o /tmp/roic10-sync.json
          node <<'JS'
          const j=require('/tmp/roic10-sync.json');
          if(!j.success||j.ticker!=='NFLX'||j.schemaVersion!=='AA_SEC_V3')
            throw Error('Refuse unknown source/schema');
          const expected=new Set([2016,2017,2018,2019,2020,2021,2022,2023,2024,2025]);
          if(!j.annualFinancials.filter(r=>expected.has(r.fiscalYear)).every(r=>Number.isFinite(r.roic)))
            throw Error('Ten-year ROIC source incomplete');
          const annual=j.annualFinancials.map(r=>({
            year:r.fiscalYear,roic:r.roic,short:r.shortTermDebt,
            long:r.longTermDebt,debt:r.totalDebt,invested:r.investedCapital,
            average:r.averageInvestedCapital,nopat:r.nopat
          }));
          const quarters=j.quarterlyFinancials.map(r=>({
            date:r.fiscalPeriodEnd,debt:r.totalDebt,invested:r.investedCapital
          }));
          console.log('ROIC10_SYNC_ROWS:'+JSON.stringify({annual,quarters}));
          JS
