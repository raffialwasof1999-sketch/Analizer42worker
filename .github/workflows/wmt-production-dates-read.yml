name: Read-only Walmart production disclosure dates
on:
  push:
    branches:
      - audit/wmt-production-dates-20261020
jobs:
  dates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read current Worker historical WMT quarterly dates
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 \
            "https://analyzer42-sec.raffialwasof-1999.workers.dev/?ticker=WMT" \
            -o /tmp/wmt-live.json
          node <<'JS'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync('/tmp/wmt-live.json','utf8'));
          if(!d.success||d.ticker!=='WMT'||d.schemaVersion!=='AA_SEC_V3')
            throw Error('Production Worker is not returning verified WMT data');
          const rows=d.quarterlyFinancials;
          if(rows.length!==60)throw Error('Unexpected WMT quarter history length: '+rows.length);
          if(rows.find(x=>x.fiscalPeriodEnd==='2023-04-30')?.earningsDisclosureDate!=='2023-05-18')
            throw Error('Historical SEC recovery is not live');
          console.log('WMT_DATES_START');
          console.log(JSON.stringify(rows.map(r=>({
            end:r.fiscalPeriodEnd,
            report:r.secFilingDate,
            earnings:r.earningsDisclosureDate
          }))));
          console.log('WMT_DATES_END');
          JS
      - name: Audit live basic EPS CSV feeds used by Google Sheets
        run: |
          set -e
          base="https://analyzer42-sec.raffialwasof-1999.workers.dev/"
          for type in quarterly annual; do
            file="/tmp/wmt-${type}.csv"
            curl --retry 2 --retry-delay 2 --max-time 100 --fail-with-body --show-error --silent \
              "${base}?ticker=WMT&basicEpsCsv=${type}&revision=3" -o "$file"
            echo "FEED_${type}_START"
            node -e '
              const fs=require("fs");
              const f=fs.readFileSync(process.argv[1],"utf8");
              const lines=f.trim().split(/\r?\n/);
              const nums=lines.filter(s=>Number.isFinite(Number(s)));
              console.log(JSON.stringify({length:lines.length,nonempty:lines.filter(x=>x!=="NA").length,numeric:nums.length,first:lines.slice(0,6),last:lines.slice(-4)}));
              if(lines.length<(process.argv[2]==="quarterly"?50:15) || nums.length<10)process.exitCode=1;
            ' "$file" "$type"
            echo "FEED_${type}_END"
          done
