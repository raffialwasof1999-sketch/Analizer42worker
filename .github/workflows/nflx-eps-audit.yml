name: Test SEC split-crossing basic EPS recovery
on:
  push:
    branches: [fix/nflx-basic-eps-basis-20261020]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all regression tests
        run: npm test
      - name: Syntax check Worker
        run: node --check src/index.js
