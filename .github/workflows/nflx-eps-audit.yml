name: Diagnose NFLX split-basis EPS gaps
on:
  push:
    branches:
      - fix/nflx-basic-eps-basis-20261020
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect production Netflix EPS and split audit
        run: |
          curl --retry 2 --max-time 120 --fail-with-body -sS "https://analyzer42-sec.raffialwasof-1999.workers.dev/?ticker=NFLX" -o /tmp/nflx.json
          node <<'JS'
          const j=require('/tmp/nflx.json');
          if(!j.success || j.ticker!=='NFLX') throw Error('Invalid production response');
          console.log('AUDIT:'+JSON.stringify(j.stockSplitAudit));
          console.log('ROWS:'+JSON.stringify(j.quarterlyFinancials.slice(0,12).map(q=>({period:q.fiscalPeriodEnd,fy:q.fiscalYear,fq:q.fiscalQuarter,basic:q.basicEPS,diluted:q.dilutedEPS,net:q.netIncome,share:q.dilutedShares}))));
          console.log('ANNUAL:'+JSON.stringify(j.annualFinancials.slice(0,5).map(q=>({period:q.fiscalPeriodEnd,basic:q.basicEPS,net:q.netIncome}))));
          JS
