
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">

  <style>
    :root {
      font: 13px Arial, sans-serif;
      color: #202124;
    }

    body {
      margin: 0;
      padding: 17px;
      background: #fff;
    }

    h1 {
      font-size: 16px;
      margin: 0 0 6px;
    }

    .hint {
      color: #5f6368;
      line-height: 1.5;
      margin: 0 0 16px;
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px 11px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      font: 15px Arial, sans-serif;
      outline: none;
    }

    input:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 1px #1a73e8;
    }

    #status {
      min-height: 20px;
      margin-top: 11px;
      color: #5f6368;
      font-size: 12px;
      line-height: 1.5;
    }

    #results {
      margin-top: 8px;
      max-height: calc(100vh - 210px);
      overflow-y: auto;
    }

    button.entry {
      border: 0;
      border-bottom: 1px solid #eee;
      background: #fff;
      width: 100%;
      padding: 12px 5px;
      text-align: left;
      cursor: pointer;
    }

    button.entry:hover,
    button.entry.selected {
      background: #e8f0fe;
      border-radius: 4px;
    }

    .symbol {
      font-weight: 700;
      color: #1a73e8;
    }

    .company {
      display: block;
      margin: 5px 0;
      line-height: 1.4;
    }

    .exchange {
      color: #5f6368;
      font-size: 11px;
    }

    .warning {
      color: #b06000 !important;
    }

    .error {
      color: #b3261e !important;
    }

    .ok {
      color: #137333 !important;
    }
  </style>
</head>

<body>

<h1>Find a stock</h1>

<p class="hint">
  Search by company name or ticker.
  Choose a result to enter its symbol in
  <b>Analyzer!B2</b>
  and refresh your existing SEC data.
</p>

<label for="query">
  Company or ticker
</label>

<input
  id="query"
  type="search"
  placeholder="Try AT&T, Apple, AAPL, AVGO…"
  autocomplete="off"
  disabled
>

<div
  id="status"
  role="status"
  aria-live="polite"
>
  Loading U.S. stock directory…
</div>

<div
  id="results"
  role="listbox"
  aria-label="Ticker suggestions"
></div>

<script>
'use strict';

let directory = [];
let results = [];
let selectedIndex = 0;
let working = false;

const input = document.getElementById('query');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');


/**
 * Normalize company names and symbols
 * to allow flexible matching.
 */
function normalize(text) {
  return String(text || '')
    .toUpperCase()
    .normalize('NFKD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/&/g, '')
    .replace(/[^A-Z0-9]/g, '');
}


/**
 * Levenshtein distance:
 * permits small spelling mistakes.
 */
function distance(a, b, cutoff) {
  if (Math.abs(a.length - b.length) > cutoff) {
    return cutoff + 1;
  }

  const previous = Array.from(
    {length: b.length + 1},
    (_, i) => i
  );

  for (let i = 1; i <= a.length; i++) {
    let old = previous[0];
    previous[0] = i;

    let min = previous[0];

    for (let j = 1; j <= b.length; j++) {
      const tmp = previous[j];

      previous[j] = Math.min(
        previous[j] + 1,
        previous[j - 1] + 1,
        old + (a[i - 1] === b[j - 1] ? 0 : 1)
      );

      old = tmp;
      min = Math.min(min, previous[j]);
    }

    if (min > cutoff) {
      return cutoff + 1;
    }
  }

  return previous[b.length];
}


/**
 * Search symbols and company names.
 * Prioritize exact matches and prefixes.
 * Add typo-tolerant results when appropriate.
 */
function bestMatches(query) {
  const q = normalize(query);

  if (!q) {
    return [];
  }

  let matches = [];

  directory.forEach(rec => {
    const symbol = rec[0];
    const company = rec[1];

    const sn = normalize(symbol);
    const cn = normalize(company);

    let score = -1;

    if (sn === q) {
      score = 2000;

    } else if (cn === q) {
      score = 1900;

    } else if (sn.startsWith(q)) {
      score = 1400 - sn.length;

    } else if (cn.startsWith(q)) {
      score = 1300 - Math.min(cn.length, 100) / 10;

    } else if (cn.includes(q)) {
      score = 900 - cn.indexOf(q);

    } else if (sn.includes(q)) {
      score = 800;
    }

    if (score >= 0) {
      matches.push({
        rec: rec,
        score: score
      });
    }
  });

  if (matches.length < 5 && q.length >= 3) {
    const threshold = q.length < 6 ? 1 : 2;

    directory.forEach(rec => {
      if (matches.some(m => m.rec[0] === rec[0])) {
        return;
      }

      const symbol = normalize(rec[0]);

      const firstTokens = String(rec[1])
        .split(/[ \t-]+/)
        .slice(0, 3)
        .map(normalize);

      let d = distance(q, symbol, threshold);

      for (const token of firstTokens) {
        d = Math.min(
          d,
          distance(q, token, threshold)
        );
      }

      if (d <= threshold) {
        matches.push({
          rec: rec,
          score: 100 - d * 40
        });
      }
    });
  }

  matches.sort(
    (a, b) =>
      b.score - a.score ||
      a.rec[0].localeCompare(b.rec[0])
  );

  return matches
    .slice(0, 12)
    .map(x => x.rec);
}


function status(message, kind) {
  statusEl.textContent = message;
  statusEl.className = kind || '';
}


/**
 * Update suggestions when typing.
 */
function render() {
  results = bestMatches(input.value);
  selectedIndex = 0;
  paint();
}


/**
 * Display selectable ticker suggestions.
 */
function paint() {
  resultsEl.replaceChildren();

  results.forEach((rec, i) => {
    const btn = document.createElement('button');

    btn.type = 'button';

    btn.className =
      'entry' +
      (i === selectedIndex ? ' selected' : '');

    btn.setAttribute('role', 'option');

    btn.setAttribute(
      'aria-selected',
      i === selectedIndex ? 'true' : 'false'
    );

    const s = document.createElement('span');
    s.className = 'symbol';
    s.textContent = rec[0];
    btn.appendChild(s);

    const n = document.createElement('span');
    n.className = 'company';
    n.textContent = rec[1];
    btn.appendChild(n);

    const ex = document.createElement('span');
    ex.className = 'exchange';
    ex.textContent = rec[2];
    btn.appendChild(ex);

    btn.addEventListener(
      'click',
      () => choose(rec[0])
    );

    resultsEl.appendChild(btn);
  });

  if (!working && input.value.trim()) {
    status(
      results.length
        ? results.length +
          ' suggestion' +
          (results.length === 1 ? '' : 's') +
          ' — select one to update the analyzer.'
        : 'No matching company or ticker found.'
    );
  }
}


/**
 * Insert selected ticker into B2
 * and trigger existing SEC refresh.
 */
function choose(symbol) {
  if (working) {
    return;
  }

  working = true;
  input.disabled = true;
  resultsEl.replaceChildren();

  status(
    'Updating ' +
    symbol +
    ' and refreshing SEC data…'
  );

  google.script.run
    .withSuccessHandler(result => {
      working = false;
      input.disabled = false;

      status(
        result.ticker +
        ' selected. ' +
        result.message,
        'ok'
      );

      input.value = result.ticker;
      input.focus();
    })
    .withFailureHandler(error => {
      working = false;
      input.disabled = false;

      status(
        error.message || String(error),
        'error'
      );

      input.focus();
    })
    .analyzer42SelectTicker(symbol);
}


/**
 * Search as user types.
 */
input.addEventListener('input', render);


/**
 * Keyboard navigation:
 * Up/down arrows, Enter, Escape.
 */
input.addEventListener('keydown', event => {
  if (
    event.key === 'ArrowDown' &&
    results.length
  ) {
    event.preventDefault();

    selectedIndex =
      (selectedIndex + 1) % results.length;

    paint();
  }

  if (
    event.key === 'ArrowUp' &&
    results.length
  ) {
    event.preventDefault();

    selectedIndex =
      (selectedIndex + results.length - 1) %
      results.length;

    paint();
  }

  if (
    event.key === 'Enter' &&
    results.length
  ) {
    event.preventDefault();

    choose(results[selectedIndex][0]);
  }

  if (event.key === 'Escape') {
    input.value = '';
    render();

    status('Search by company name or ticker.');
  }
});


/**
 * Load directory upon opening sidebar.
 */
google.script.run
  .withSuccessHandler(data => {
    directory = data.listings || [];

    input.disabled = false;
    input.focus();

    status(
      'Ready — ' +
      directory.length.toLocaleString() +
      ' U.S. stock listings.' +
      (
        data.warnings.length
          ? ' Some exchanges may be unavailable: ' +
            data.warnings.join('; ')
          : ''
      ),
      data.warnings.length ? 'warning' : ''
    );
  })
  .withFailureHandler(error => {
    status(
      error.message || String(error),
      'error'
    );
  })
  .analyzer42GetTickerDirectory();

</script>
</body>
</html>
